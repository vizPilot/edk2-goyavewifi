name: EDK2 DEBUG

on:
  push:
    branches: [ "sdcard" ]
  pull_request:
    branches: [ "sdcard" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4.1.5
    - name: CI Build
      run: chmod +x ci-build.sh && ./ci-build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: goyavewifi
        path: ./workspace/kernel.img-kernel

    - uses: actions/upload-artifact@v4
      with:
        name: E1M
        path: ./workspace/E1M.img
