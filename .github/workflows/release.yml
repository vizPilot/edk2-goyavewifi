name: EDK2 Release

on:
  push:
    branches: [ "sdcard" ]
  pull_request:
    branches: [ "sdcard" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4.1.5
    - name: CI Build
      run: chmod +x ci-release.sh && ./ci-release.sh

    - uses: actions/upload-artifact@v4
      with:
        name: Y560
        path: ./workspace/kernel.img-kernel
